name: daily
on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "true = only send a test Telegram message"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: daily
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python src/run_daily.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST: ${{ inputs.test }}
      - name: Commit result
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add data
          git commit -m "daily $(date -u +%F)" || echo "nothing to commit"
          git pull --rebase origin main
          git push
