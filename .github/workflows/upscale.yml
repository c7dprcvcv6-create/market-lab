name: Make 9-16 Video Ready
on:
  push:
    paths:
      - 'videos/**'
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Convert to 9-16
        run: |
          mkdir -p output
          for f in videos/*; do
            [ -e "$f" ] || continue
            case "$f" in *.mp4|*.mov|*.MP4|*.MOV) ;; *) echo "Skip $f"; continue;; esac
            ffmpeg -y -i "$f" -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,unsharp=5:5:0.8:3:3:0.4" -c:v libx264 -crf 18 -preset slow -c:a aac -b:a 192k "output/${f##*/}"
          done
      - name: Save back
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Add 9-16 video"
          file_pattern: output/
