name: smoke-test
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python src/hello.py
      - name: Commit result
        run: |
          git config user.name "market-lab-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data
          git commit -m "smoke test" || echo "nothing to commit"
          git push
